name: Serverless AWS Deployment

on:
  push:
    branches:
      - master # Se activa solo en pushes a la rama master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Usar la misma versión que la Lambda

      - name: Install Dependencies
        run: npm install

      - name: Install Serverless Framework
        run: npm install -g serverless

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Usar la misma región que en serverless.yml

      - name: Serverless Deploy
        run: sls deploy --stage prod # Implementar en la etapa 'prod'
        env:
          # Si se usan variables de entorno adicionales, se definen aquí
          DYNAMODB_TABLE: inventory-items-prod
          
      - name: Show API Endpoint
        run: sls info --stage prod
          
      - name: Show API Endpoint
        run: sls info --stage prod
